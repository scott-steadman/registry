default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch('DB_HOST','localhost') %>
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: postgres
  password: <%= ENV['POSTGRES_PASSWORD'] %>
  # Pin the search path: the server default is `"",public`, which the :sql
  # schema dumper writes verbatim into structure.sql as
  # `SET search_path TO "",public;` -- and psql rejects the empty identifier
  # when loading it back.
  schema_search_path: public

development:
  <<: *default
  database: registry_development

test:
  <<: *default
  database: registry_test
